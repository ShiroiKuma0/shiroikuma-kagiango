name: Bug Report
description: Report a bug.
title: "[BUG] "
labels: bug
body:
  - type: markdown
    attributes:
      value: |
        Please search the open issues first.
  - type: checkboxes
    attributes:
      label: Checks
      options:
        - label: I have searched the open issues, and still think this is a new bug.
          required: true
  - type: textarea
    id: bug
    attributes:
      label: "Describe the bug you encountered:"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: "Describe what you expected to happen:"
  - type: markdown
    attributes:
      value: |
          Please follow these steps to find your app version:
          1. Click the **⁝** icon in the top right corner
          2. Select **Settings**
          3. Click **About**
          4. Find the "Version" information and provide it below
  - type: input
    id: version
    attributes:
      label: "What version of 白い熊 鍵暗号 are you using?"
    validations:
      required: true
  - type: markdown
    attributes:
      value: |
        Please follow these steps to find your Android version:
        1. Open your device's **Settings** app
        2. Scroll down and select **About phone** or **About tablet**
        3. Find the **Android version** section and provide it below
  - type: input
    id: os
    attributes:
      label: "Which version of Android are you on?"
    validations:
      required: true

